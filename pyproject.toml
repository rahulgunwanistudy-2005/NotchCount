[project]
name = "notchcount"
version = "0.1.0"
description = "NotchCount monorepo (Python side): estimator, pipeline, API, worker, simulation"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "notchcount-stats",
    "notchcount-pipeline",
    "notchcount-api",
    "notchcount-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/notchcount_stats",
    "packages/pipeline",
    "services/api",
    "services/worker",
]

[tool.uv.sources]
notchcount-stats = { workspace = true }
notchcount-pipeline = { workspace = true }
notchcount-api = { workspace = true }
notchcount-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
    "matplotlib>=3.9",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "models/cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "S105", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["notchcount_stats", "notchcount_pipeline", "notchcount_api", "notchcount_worker", "sim"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"sim/**" = ["S311"]
# Standalone Kaggle notebook script: installs its own deps at the top, then imports.
"benchmarks/**" = ["E402", "S", "B905", "RUF046"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/notchcount_stats/src:packages/pipeline/src:services/api/src:services/worker/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "onnxruntime.*", "cv2.*", "scipy.*", "sklearn.*", "geoalchemy2.*", "pgvector.*", "asyncpg.*", "shapely.*", "pyproj.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/notchcount_stats/tests", "packages/pipeline/tests", "services/api/tests", "services/worker/tests", "sim/tests"]
markers = [
    "db: needs a Postgres with postgis + vector (DATABASE_URL)",
    "models: needs ONNX model files under models/cache",
]
