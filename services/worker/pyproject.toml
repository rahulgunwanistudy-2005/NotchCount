[project]
name = "notchcount-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = ["notchcount-api", "notchcount-pipeline", "notchcount-stats"]

[project.scripts]
nc-worker = "notchcount_worker.runner:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notchcount_worker"]

[tool.uv.sources]
notchcount-api = { workspace = true }
notchcount-pipeline = { workspace = true }
notchcount-stats = { workspace = true }
