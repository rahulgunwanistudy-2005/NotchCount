[project]
name = "notchcount-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "pydantic-settings>=2.6", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30", "alembic>=1.14", "geoalchemy2>=0.16", "pgvector>=0.3.6", "pyjwt[crypto]>=2.10", "httpx>=0.28", "python-multipart>=0.0.17", "pyyaml>=6.0", "notchcount-stats"]

[project.scripts]
nc-admin = "notchcount_api.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notchcount_api"]

[tool.uv.sources]
notchcount-stats = { workspace = true }
