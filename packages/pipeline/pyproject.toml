[project]
name = "notchcount-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = ["numpy>=2.0", "pillow>=11.0", "opencv-python-headless>=4.10", "onnxruntime>=1.20", "scikit-learn>=1.5", "scipy>=1.14", "notchcount-stats"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notchcount_pipeline"]

[tool.uv.sources]
notchcount-stats = { workspace = true }
